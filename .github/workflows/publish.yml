name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # Trusted Publishing: npm exchanges the OIDC token for a short-lived credential and attaches provenance.
  # The trusted publisher may only stage, so a maintainer approves each version on npmjs.com with 2FA.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Staged publishing needs npm 11.15.0 or later, which the npm bundled with Node 24 may predate
      - run: npm install -g npm@11.15.0
      - name: Check that the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: node --test
      - run: npm stage publish
