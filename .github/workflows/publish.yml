name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # Trusted Publishing: npm exchanges the OIDC token for a short-lived publish credential and attaches provenance
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing needs npm 11.5.1 or later, which Node 24 ships with
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check that the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: node --test
      - run: npm publish
